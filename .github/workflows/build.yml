name: build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan + toolchain from lean-toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch mathlib build cache (fail loudly on a cache miss)
        run: |
          lake exe cache get || { echo "MATHLIB CACHE MISS"; exit 1; }

      - name: Build (explicit target — the bare lake build has no default target here)
        run: |
          lake build MyProof.Axioms

      - name: 'Axioms check (every theorem: standard trio only)'
        run: |
          set -o pipefail
          lake env lean MyProof/Axioms.lean 2>&1 | tee /tmp/ax.log
          # fail on ANY output line that is not a standard-trio axiom footprint
          # (unknown-constant errors, extra axioms, or any other drift)
          awk '/depends on axioms/ && !/\[propext, Classical.choice, Quot.sound\]/ { print; bad=1 } END { if (bad) exit 1 }' /tmp/ax.log

      - name: Theorem count into step summary
        run: |
          n=$(grep -c '#print axioms' MyProof/Axioms.lean)
          echo "theorems=$n" >> $GITHUB_STEP_SUMMARY
          echo "modules: $(ls MyProof/Heaviside*.lean | wc -l) Heaviside modules + $(ls MyProof | grep -v '^Heaviside' | grep -v Axioms | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY

      - name: Build dossier PDF from the README (single source)
        run: |
          pip install --quiet weasyprint markdown
          python3 scripts/make_pdf.py

      - uses: actions/upload-artifact@v4
        with:
          name: heaviside-dossier
          path: heaviside-dossier.pdf
